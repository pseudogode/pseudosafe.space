name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the SSH private key is a secret. Everything else is a non-secret
# repository variable (Settings > Secrets and variables > Actions > Variables),
# exposed here as environment variables.
env:
  VPS_HOST: ${{ vars.VPS_HOST }}
  VPS_USER: ${{ vars.VPS_USER }}
  APP_DIR: ${{ vars.APP_DIR }}
  REPO_URL: ${{ vars.REPO_URL }}
  DOMAIN: ${{ vars.DOMAIN }}
  LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run startup script on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' \
             REPO_URL='$REPO_URL' \
             BRANCH='main' \
             DOMAIN='$DOMAIN' \
             EMAIL='$LETSENCRYPT_EMAIL' \
             bash -s" < scripts/startup.sh
