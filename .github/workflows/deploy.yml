name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull secrets/variables from the "prod" GitHub Environment.
    environment: prod
    # Only VPS_SSH_PRIVATE_KEY is a secret; the rest are non-secret Environment
    # variables (Settings > Environments > prod > Variables), surfaced here as
    # shell env vars. Defined at job level so the prod environment context is
    # available when these expressions resolve.
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      APP_DIR: ${{ vars.APP_DIR }}
      REPO_URL: ${{ vars.REPO_URL }}
      DOMAIN: ${{ vars.DOMAIN }}
      LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run startup script on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' \
             REPO_URL='$REPO_URL' \
             BRANCH='main' \
             DOMAIN='$DOMAIN' \
             EMAIL='$LETSENCRYPT_EMAIL' \
             bash -s" < scripts/startup.sh
