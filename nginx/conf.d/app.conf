# HTTP: serve the ACME challenge and redirect everything else to HTTPS.
server {
    listen 80;
    server_name pseudosafe.space www.pseudosafe.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to all app containers.
server {
    listen 443 ssl;
    server_name pseudosafe.space www.pseudosafe.space;

    ssl_certificate     /etc/letsencrypt/live/pseudosafe.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pseudosafe.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Portal client (static)
    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal API — keep the /api prefix, the server routes on it.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge client (static, built with base=/bridge/).
    location /bridge/ {
        proxy_pass http://bridge-client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge server (Socket.IO). Trailing slash strips /bridge-api so the
    # upstream sees /socket.io. WebSocket upgrade headers are required.
    location /bridge-api/ {
        proxy_pass http://bridge-server:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
